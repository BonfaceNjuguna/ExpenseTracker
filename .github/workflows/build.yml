name: debian-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: debian
    runs-on: ubuntu-latest
    container:
      image: debian:sid

    steps:
    - uses: actions/checkout@v4

    - name: Install base dependencies
      run: |
        apt-get update
        apt-get install -y \
          libasound2-dev ant autoconf automake bc gambc gcc git imagemagick \
          libtool libtool-bin libxext-dev make libgl1-mesa-dev \
          libglu1-mesa-dev libnetpbm-dev libfindbin-libs-perl libportaudio2 \
          tar tcl-dev texlive unzip wget zip python3 perl

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Verify Java
      run: java -version

    - name: Get LambdaNative
      run: |
        git clone https://github.com/part-cw/lambdanative
        cd lambdanative
        git checkout b6e82ee343d8ea3c95e277d7e122baae9a5dc096

    - name: Patch clipboard module bug
      working-directory: lambdanative
      run: |
        # Fix clipboard_clear function signature mismatch
        # Show original content
        echo "=== Original clipboard.scm ==="
        cat -A modules/clipboard/clipboard.scm
        # Use perl with slurp mode to handle multiline
        perl -i -0777 -pe 's/\(c-lambda\s*\(int\)\s*int\s*"clipboard_clear"\)/(c-lambda () int "clipboard_clear")/gs' modules/clipboard/clipboard.scm
        echo "=== Patched clipboard.scm ==="
        cat modules/clipboard/clipboard.scm

    - name: Copy ExpenseTracker app
      run: cp -r ExpenseTracker lambdanative/apps/

    - name: Setup Android SDK
      run: |
        mkdir -p android-sdk/cmdline-tools
        wget -O commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -o -d android-sdk/cmdline-tools commandlinetools.zip
        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
        chmod +x android-sdk/cmdline-tools/latest/bin/sdkmanager
        export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "platforms;android-28"
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "build-tools;29.0.3"
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "tools"
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "extras;android;m2repository"
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "ndk;21.4.7075529"
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "platform-tools"
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk --licenses
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -noprompt -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, S=Unknown, C=Unknown"

    - name: Debug SDK setup
      run: |
        ls -R android-sdk/
        file android-sdk/cmdline-tools/latest/bin/sdkmanager

    - name: Prepare LambdaNative
      working-directory: lambdanative
      run: |
        cp SETUP.template SETUP
        sed -i 's/ANDROIDAPI=21/ANDROIDAPI=28/g' SETUP
        # SETUP is sourced from different build directories; use absolute paths.
        cat >> SETUP <<EOF
        ANDROIDSDK="$GITHUB_WORKSPACE/android-sdk"
        ANDROIDNDK="$GITHUB_WORKSPACE/android-sdk/ndk/21.4.7075529"
        EOF
        cp PROFILE.template PROFILE
        sed -i 's|SYS_ANDROIDPW="yoursecrethere"|SYS_ANDROIDPW="android"|g' PROFILE

    - name: Check Scheme startup and transaction actions
      run: |
        gsi -e '(with-exception-catcher (lambda (e) (display-exception e) (exit 1)) (lambda () (load "tests/startup.scm")))'

    - name: Linux build
      working-directory: lambdanative
      run: |
        ./configure ExpenseTracker --verbose
        make

    - name: Android build
      working-directory: lambdanative
      run: |
        sed -i 's/python/python3/g' targets/android/check-tools
        mkdir -p ~/.cache/lambdanative/android/support
        ./configure ExpenseTracker --verbose android debug
        make || { echo "Android build failed"; cat config.log; exit 1; }

    - name: Verify APK metadata and Pixel 7 architecture
      run: |
        set -eu
        found=0
        for apk in "$HOME"/.cache/lambdanative/packages/*.apk; do
          [ -f "$apk" ] || continue
          found=1
          "$GITHUB_WORKSPACE/android-sdk/build-tools/29.0.3/aapt" dump badging "$apk" | tee apk-info.txt
          # Pixel 7 needs a 64-bit ARM native library.
          unzip -Z1 "$apk" | grep -E '^lib/arm64-v8a/[^/]+\.so$'
        done
        [ "$found" -eq 1 ] || { echo "No APK was produced"; exit 1; }

    - uses: actions/upload-artifact@v4
      with:
        name: apk
        if-no-files-found: error
        path: |
          ~/.cache/lambdanative/packages/*.apk
          apk-info.txt
