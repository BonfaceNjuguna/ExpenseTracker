name: fedora-build

on:
  push:
    branches: [ main, improved-expense-income-tracker ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
    - uses: actions/checkout@v6
    - run: cat /etc/os-release
    - name: install dependencies
      run: |
       dnf -y install alsa-lib-devel ant autoconf automake bc curl gambit-c
       dnf -y install gcc-14 git grep ImageMagick-devel java-25-openjdk-devel
       dnf -y install libtool libXext-devel make mesa-libGL-devel
       dnf -y install mesa-libGLU-devel netpbm-devel patch perl-FindBin
       dnf -y install portaudio python3-sdkmanager sed tar tcl-devel texlive perl-Digest-SHA
       dnf -y install which wget zip unzip sqlite-devel
       dnf -y install m4 pkgconf-pkg-config gettext-devel autoconf-archive
    - name: Get LambdaNative
      run: |
       git clone https://github.com/part-cw/lambdanative
       cd lambdanative
       git checkout b6e82ee343d8ea3c95e277d7e122baae9a5dc096
       cd modules
       rm -rf gps
       git clone https://github.com/rabsss/gps_module gps
    - name: setup android
      run: |
       # https://stackoverflow.com/a/77215395
       # https://computingforgeeks.com/install-and-use-android-studio-on-fedora/
       mkdir -p /home/build/android-sdk
       export ANDROID_HOME=/home/build/android-sdk
       export ANDROID_SDK_ROOT="$ANDROID_HOME"
       echo yes | sdkmanager --sdk_root=/home/build/android-sdk "platforms;android-28"
       echo yes | sdkmanager --sdk_root=/home/build/android-sdk "build-tools;29.0.3"
       echo yes | sdkmanager --sdk_root=/home/build/android-sdk "tools"
       echo yes | sdkmanager --sdk_root=/home/build/android-sdk "ndk;21.4.7075529"
       echo yes | sdkmanager --sdk_root=/home/build/android-sdk "platform-tools"
       echo yes | sdkmanager --sdk_root=/home/build/android-sdk --licenses
       # The pinned loader needs this support JAR, not the obsolete Maven archive.
       mkdir -p "$ANDROID_HOME/extras/android/support/v4"
       curl --fail --location --retry 3 -o /tmp/support-v4.aar \
         https://dl.google.com/dl/android/maven2/com/android/support/support-v4/23.4.0/support-v4-23.4.0.aar
       unzip -p /tmp/support-v4.aar classes.jar > "$ANDROID_HOME/extras/android/support/v4/android-support-v4.jar"
       # https://coderwall.com/p/r09hoq/android-generate-release-debug-keystores
       # https://stackoverflow.com/a/13578480
       keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -noprompt -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, S=Unknown, C=Unknown"
    - name: prepare lambdanative
      working-directory: lambdanative
      run : |
       cp SETUP.template SETUP
       sed -i 's/ANDROIDAPI=21/ANDROIDAPI=28/g' SETUP
       # Use explicit absolute paths; SETUP is sourced from several directories.
       cat >> SETUP <<EOF
       ANDROIDSDK="/home/build/android-sdk"
       ANDROIDNDK="/home/build/android-sdk/ndk/21.4.7075529"
       EOF
       cp PROFILE.template PROFILE
       sed -i 's|SYS_ANDROIDPW="yoursecrethere"|SYS_ANDROIDPW="android"|g' PROFILE
       sed -i 's|SYS_CC="gcc $SYS|SYS_CC="gcc-14 $SYS|g' targets/linux/host_linux
       sed -i 's|SYS_CXX="g++ $SYS|SYS_CXX="g++-13 $SYS|g' targets/linux/host_linux
       sed -i 's|gcc -Werror|gcc-14 -Werror|g' targets/linux/check-libraries
    - name: Patch clipboard module bug
      working-directory: lambdanative
      run: |
        # Fix clipboard_clear function signature mismatch
        # Show original content
        echo "=== Original clipboard.scm ==="
        cat -A modules/clipboard/clipboard.scm
        # Use perl with slurp mode to handle multiline
        perl -i -0777 -pe 's/\(c-lambda\s*\(int\)\s*int\s*"clipboard_clear"\)/(c-lambda () int "clipboard_clear")/gs' modules/clipboard/clipboard.scm
        echo "=== Patched clipboard.scm ==="
        cat modules/clipboard/clipboard.scm
    - name: Copy ExpenseTracker app
      run: cp -r ExpenseTracker lambdanative/apps/
    - name: Check Scheme startup and transaction actions
      # Fedora Gambit embeds RPM packaging flags. This temporary test module
      # is not an RPM build, so use ordinary compiler/linker flags instead.
      env:
        CORCXXFLAGS_GAMBUILD: -O2
        LDFLAGS_GAMBUILD: -Wl,-z,relro -Wl,-z,now
      run: |
        LAMBDANATIVE_DIR="$GITHUB_WORKSPACE/lambdanative" ./tests/run.sh
    - name: Build JPEG without legacy libtool
      working-directory: lambdanative
      run: |
        # In JPEG 6b, --enable-static opts into libtool. Disabling both
        # libtool variants selects its plain .o -> libjpeg.a build instead.
        # Apply this to the recipe so Linux and every Android ABI use it.
        sed -i 's/--disable-shared --enable-static/--disable-shared --disable-static/' libraries/libjpeg/make.sh
        # Reuse the installed GNU helper instead of an obsolete HTTP download.
        python3 - <<'PY'
        from pathlib import Path
        recipe = Path('libraries/libjpeg/make.sh')
        lines = recipe.read_text().splitlines()
        recipe.write_text('\n'.join('cp /usr/share/automake*/config.sub .' if 'wget -O config.sub' in line else line for line in lines) + '\n')
        PY
    - name: Enable Linux list wheel scrolling
      working-directory: lambdanative
      run: |
        python3 - <<'PY'
        from pathlib import Path
        path = Path('loaders/x11/x11_microgl.c')
        source = path.read_text()
        if '/* expense tracker wheel scrolling */' not in source:
            start = source.index('case ButtonPress:')
            pos = source.index('          case Button1:', start)
            source = source[:pos] + '''          /* expense tracker wheel scrolling */
                  case Button4:
                   microgl_hook(EVENT_KEYPRESS, EVENT_KEYUP, 0);
                   break;
                  case Button5:
                   microgl_hook(EVENT_KEYPRESS, EVENT_KEYDOWN, 0);
                   break;
        ''' + source[pos:]
            path.write_text(source)
        PY
    - name: Linux configure (fetch deps)
      working-directory: lambdanative
      run: |
        ./configure ExpenseTracker --verbose

    - name: Linux build
      working-directory: lambdanative
      run: make
    - name: Patch clang toolchain for Android
      run: |
        NDK_TOOLCHAIN=/home/build/android-sdk/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin
        if [ ! -f "$NDK_TOOLCHAIN/aarch64-linux-android28-clang" ] && [ -f "$NDK_TOOLCHAIN/aarch64-linux-android-clang" ]; then
          ln -s "$NDK_TOOLCHAIN/aarch64-linux-android-clang" "$NDK_TOOLCHAIN/aarch64-linux-android28-clang"
        fi
        if [ ! -f "$NDK_TOOLCHAIN/aarch64-linux-android28-clang++" ] && [ -f "$NDK_TOOLCHAIN/aarch64-linux-android-clang++" ]; then
          ln -s "$NDK_TOOLCHAIN/aarch64-linux-android-clang++" "$NDK_TOOLCHAIN/aarch64-linux-android28-clang++"
        fi
        if [ ! -f "$NDK_TOOLCHAIN/armv7a-linux-androideabi28-clang" ] && [ -f "$NDK_TOOLCHAIN/armv7a-linux-androideabi-clang" ]; then
          ln -s "$NDK_TOOLCHAIN/armv7a-linux-androideabi-clang" "$NDK_TOOLCHAIN/armv7a-linux-androideabi28-clang"
        fi
        if [ ! -f "$NDK_TOOLCHAIN/armv7a-linux-androideabi28-clang++" ] && [ -f "$NDK_TOOLCHAIN/armv7a-linux-androideabi-clang++" ]; then
          ln -s "$NDK_TOOLCHAIN/armv7a-linux-androideabi-clang++" "$NDK_TOOLCHAIN/armv7a-linux-androideabi28-clang++"
        fi
    - name: Android build
      working-directory: lambdanative
      run: |
        sed -i -E 's/\bpython3*\b/python3/g' targets/android/check-tools
        mkdir -p ~/.cache/lambdanative/android/support
        ./configure ExpenseTracker --verbose android debug
        make || { echo "Android build failed"; cat config.log; exit 1; }
    - name: Verify APK metadata and Pixel 7 architecture
      run: |
        set -eu
        found=0
        for apk in "$HOME"/.cache/lambdanative/packages/*.apk; do
          [ -f "$apk" ] || continue
          found=1
          /home/build/android-sdk/build-tools/29.0.3/aapt dump badging "$apk" | tee apk-info.txt
          # Pixel 7 needs a 64-bit ARM native library.
          unzip -Z1 "$apk" | grep -E '^lib/arm64-v8a/[^/]+\.so$'
        done
        [ "$found" -eq 1 ] || { echo "No APK was produced"; exit 1; }

    - name: Prepare APK download
      run: |
        # Keep the APK and metadata under one artifact root. Uploading paths
        # from HOME and the workspace together retains nested directories;
        # Pages then excludes the hidden .cache directory containing the APK.
        mkdir -p apk-download
        cp "$HOME"/.cache/lambdanative/packages/ExpenseTracker-*-android*.apk apk-download/
        cp apk-info.txt apk-download/

    - uses: actions/upload-artifact@v7
      with:
        name: apk
        if-no-files-found: error
        path: apk-download/

    - uses: actions/upload-artifact@v7
      with:
        name: linux
        if-no-files-found: error
        path: ~/.cache/lambdanative/packages/ExpenseTracker-*-linux.zip
        
  makesite:
    name: fedora
    runs-on: ubuntu-latest
    needs: build
    container:
      image: fedora:43

    steps:
    - uses: actions/checkout@v4
    - run: cat /etc/os-release
    - name: install dependencies
      run: |
       dnf -y install autoconf automake awk diffutils gcc guile-reader-devel guile-commonmark
       dnf -y install guile30-devel haunt make tar texinfo unzip
    - name: build site
      working-directory: website
      run: haunt build
    - name: download apk
      uses: actions/download-artifact@v4
      with:
        name: apk
        path: website/build
    - name: Upload static files as artifact
      id: deployment
      uses: actions/upload-pages-artifact@v4
      with:
        path: website/build
        
  # Deployment job
  deploy:
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: makesite
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
